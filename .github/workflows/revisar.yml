name: Revisar Licencia iTop VPN

on:
  schedule:
    - cron: '*/5 * * * *' # Revisa cada 5 minutos
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: monitor-itop
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Ejecutar monitor
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python monitor.py

      - name: Guardar estado actualizado
        run: |
          git config user.name "Monitor Bot"
          git config user.email "bot@users.noreply.github.com"
          git add ultimo_estado.txt
          git commit -m "Actualizar estado de licencia" || exit 0
          git push --force origin main
